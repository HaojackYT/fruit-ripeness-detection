<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruit Ripeness Detection</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- Ambient background blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="page-wrapper">
    <div class="card">

      <!-- Header -->
      <div class="card-header">
        <h1 class="title">Fruit Ripeness Detection</h1>
      </div>

      <!-- Breadcrumb -->
      <div class="breadcrumb">
        <svg class="home-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7A1 1 0 003 11h1v6a1 1 0 001 1h4v-4h2v4h4a1 1 0 001-1v-6h1a1 1 0 00.707-1.707l-7-7z"/>
        </svg>
        <span>Dashboard</span>
      </div>

      <!-- Upload Row -->
      <div class="upload-row">
        <div class="upload-field" id="uploadField">
          <label class="upload-btn" for="fileInput">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
            </svg>
            Upload File
          </label>
          <input type="file" id="fileInput" accept="image/*" hidden />
          <span class="file-name" id="fileName">No files were selected....</span>
        </div>

        <button class="detect-btn" id="detectBtn">
          <svg viewBox="0 0 20 20" fill="currentColor" class="detect-icon" aria-hidden="true">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
          </svg>
          DETECTION
        </button>
      </div>

      <!-- Preview Area -->
      <div class="preview-section">
        <div class="preview-box" id="previewBox">

          <!-- Placeholder -->
          <div class="placeholder" id="placeholder">
            <div class="placeholder-icon">
              <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="10" width="52" height="40" rx="4" stroke="currentColor" stroke-width="3.5" fill="none"/>
                <path d="M6 38l14-12 10 9 8-8 20 17" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="20" cy="24" r="4" stroke="currentColor" stroke-width="3" fill="none"/>
              </svg>
            </div>
            <p class="placeholder-text">Chọn ảnh để bắt đầu phát hiện</p>
          </div>

          <!-- Preview image -->
          <img id="previewImg" class="preview-img hidden" alt="Preview" />

          <!-- Loading overlay -->
          <div class="loading-overlay hidden" id="loadingOverlay">
            <div class="spinner"></div>
            <p class="loading-text">Đang phân tích...</p>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script>
    const fileInput      = document.getElementById('fileInput');
    const fileName       = document.getElementById('fileName');
    const previewImg     = document.getElementById('previewImg');
    const placeholder    = document.getElementById('placeholder');
    const detectBtn      = document.getElementById('detectBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');

    let selectedFile = null;
    let imageDataURL = null;

    /* ── File selection ── */
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      selectedFile = file;
      fileName.textContent = file.name;

      const reader = new FileReader();
      reader.onload = (e) => {
        imageDataURL = e.target.result;
        previewImg.src = imageDataURL;
        previewImg.classList.remove('hidden');
        placeholder.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    });

    /* ── Detection ── */
    detectBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        shakeUpload();
        return;
      }

      loadingOverlay.classList.remove('hidden');
      detectBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append('file', selectedFile);

        const response = await fetch('/api/predict', {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        // Save to sessionStorage and navigate
        saveAndNavigate(data.result, data.confidence);

      } catch (err) {
        console.warn('No backend — using demo data:', err.message);
        // Demo fallback
        saveAndNavigate('Apple Ripe', 0.9978);
      }
    });

    function saveAndNavigate(result, confidence) {
      // Save image + result data
      sessionStorage.setItem('frd_image', imageDataURL);
      sessionStorage.setItem('frd_result', result);
      sessionStorage.setItem('frd_confidence', confidence);

      // Navigate to result page
      window.location.href = '/result';
    }

    function shakeUpload() {
      const field = document.getElementById('uploadField');
      field.classList.add('shake');
      field.addEventListener('animationend', () => field.classList.remove('shake'), { once: true });
    }
  </script>
</body>
</html>
